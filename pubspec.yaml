name: prep_master
description: IELTS & SAT Exam Preparation App with College Application Guides
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # STATE MANAGEMENT
  flutter_bloc: ^8.1.6
  bloc: ^8.1.2
  equatable: ^2.0.5

  # DEPENDENCY INJECTION
  get_it: ^7.7.0
  injectable: ^2.4.0

  # FUNCTIONAL PROGRAMMING (Error Handling)
  dartz: ^0.10.1

  # NETWORKING
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # LOCAL STORAGE
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # UI
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0
  confetti: ^0.7.0

  # UTILITIES
  intl: ^0.19.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
